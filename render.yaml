services:
  - type: web_service
    name: AI Timetable Backend
    env: python
    plan: free
    branch: main
    root: backend
    buildCommand: cd backend && python -m pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
