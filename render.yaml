services:
  - type: web
    name: AI Timetable Backend
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_KEY
        value: "REPLACE_WITH_API_KEY"
    autoDeployTrigger: commit
